name: 🚗 Build Android APK & GitHub Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📂 Prepare Named APK for Release
        run: |
          mkdir -p release-apk
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0.3"
          fi
          echo "Preparing APK for tag: $TAG"
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" "release-apk/AutoTO-${TAG}.apk"
          cp "$APK_FILE" "release-apk/AutoTO.apk"
          ls -la release-apk/

      - name: 📤 Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTO-Release-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/AutoTO-${{ github.ref_name }}.apk
            release-apk/AutoTO.apk
          tag_name: ${{ github.ref_name }}
          name: 🚗 Авто ТО ${{ github.ref_name }} — Автономное мобильное приложение
          body: |
            ## 📱 Релиз «Авто ТО» (${{ github.ref_name }})
            
            Полностью автономное (Offline-First) мобильное приложение на React Native & Expo для Android.
            
            ---
            ### 📥 ПРЯМЫЕ ССЫЛКИ ДЛЯ СКАЧИВАНИЯ APK:
            
            Нажмите на любую ссылку ниже на вашем смартфоне для мгновенного скачивания:
            * 📲 [**Скачать AutoTO-${{ github.ref_name }}.apk (Прямая загрузка)**](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AutoTO-${{ github.ref_name }}.apk)
            * 📲 [**Скачать AutoTO.apk (Альтернативная прямая ссылка)**](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AutoTO.apk)
            
            ---
            ### ✨ Возможности и обновления:
            - 🎨 **Новая иконка приложения:** стильный неоновый дизайн со спидометром, автомобилем и ключом.
            - 📊 **Экспорт в Excel (.xlsx):** выгрузка полной книги с 4 листами (Сводка, Светофор, Журнал ТО, Реестр деталей).
            - 🍩 **Интерактивные графики:** структура бюджета по категориям и динамика стоимости ТО.
            - 🆕 **Режим «Все по нулям»:** возможность настроить новый автомобиль с чистого листа.
            - 🚦 **Светофор ресурса:** точный расчет износа 9 расходников в реальном времени.
            - 🛡️ **Умная защита пробега:** защита от ввода суточного пробега.
            - 100% Offline: работает локально на устройстве без интернета и серверов.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
